<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt Studio | 生图与文笔提示词工作台</title>
    <meta
      name="description"
      content="专注生图与文笔两类创作提示词，可查看例图、编辑关键词并一键复制。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./app-dark.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <nav class="topbar" aria-label="主导航">
          <a class="brand" href="#" aria-label="Prompt Studio 首页">
            <span class="brand-mark">P</span>
            <span>
              <strong>Prompt Studio</strong>
              <small>生图 / 文笔工作台</small>
            </span>
          </a>

          <div class="top-actions">
            <a class="admin-link" href="./admin.html">后台管理</a>
            <label class="search-box">
              <span class="search-icon" aria-hidden="true">⌕</span>
              <input id="searchInput" type="search" placeholder="搜索模板、场景或关键词" />
            </label>
          </div>
        </nav>
      </header>

      <main>
        <section class="hero">
          <canvas id="heroCanvas" aria-hidden="true"></canvas>
          <div class="hero-ghost" aria-hidden="true">STUDIO</div>
          <div class="hero-copy">
            <p class="eyebrow" data-reveal style="--i: 0">Prompt Studio · 生图 × 文笔</p>
            <h1 data-reveal style="--i: 1">把灵感，炼成一句<span class="accent">提示词。</span></h1>
            <p data-reveal style="--i: 2">
              只保留「生图」与「文笔」两条主线。左侧选方向，中间挑模板，右侧改关键词、看例图、复制成稿。
            </p>
          </div>
          <div class="hero-panel" aria-label="创作概览" data-reveal style="--i: 3">
            <div class="hero-panel-feature">
              <span>当前方向</span>
              <strong id="heroCategory">生图</strong>
            </div>
            <div>
              <strong id="templateCount">0</strong>
              <span>可用模板</span>
            </div>
            <div>
              <strong id="categoryCount">0</strong>
              <span>核心分类</span>
            </div>
          </div>
        </section>

        <section class="workspace" aria-label="提示词模板工作区">
          <aside class="sidebar">
            <div class="section-title">
              <span>创作分类</span>
              <button class="text-button" id="clearFilters" type="button">重置</button>
            </div>
            <div class="category-list" id="categoryList"></div>
          </aside>

          <section class="template-area">
            <div class="toolbar">
              <div>
                <p class="eyebrow">Studio library</p>
                <h2>灵感模板</h2>
              </div>
              <div class="sort-wrap">
                <label for="sortSelect">排序</label>
                <select id="sortSelect">
                  <option value="popular">推荐优先</option>
                  <option value="name">名称 A-Z</option>
                  <option value="recent">最近新增</option>
                </select>
              </div>
            </div>

            <div class="template-grid" id="templateGrid"></div>
            <div class="empty-state" id="emptyState" hidden>
              <strong>没有找到匹配模板</strong>
              <span>换个关键词，或者回到生图分类再试试。</span>
            </div>
          </section>

          <aside class="editor-panel" aria-label="提示词编辑器" hidden>
            <div class="editor-header">
              <div>
                <p class="eyebrow">Prompt composer</p>
                <h2 id="editorTitle">选择一个模板</h2>
              </div>
              <button class="icon-button" id="favoriteButton" type="button" aria-label="收藏当前模板">
                <span aria-hidden="true">♡</span>
              </button>
            </div>

            <p class="editor-desc" id="editorDescription">
              从模板库选择一个提示词，这里会显示可修改的关键词、例图和实时预览。
            </p>

            <section class="example-gallery" id="exampleGallery" aria-label="模板例图展示">
              <div class="preview-topline">
                <span>例图展示</span>
              </div>
              <div class="example-gallery-grid" id="exampleGalleryGrid"></div>
            </section>

            <form class="variables-form" id="variablesForm" aria-label="关键词编辑表单"></form>

            <div class="preview-card">
              <div class="preview-topline">
                <span>复制预览</span>
                <button class="text-button" id="resetVariables" type="button">恢复默认</button>
              </div>
              <pre id="promptPreview">等待选择模板...</pre>
            </div>

            <div class="editor-actions">
              <button class="primary-button" id="copyButton" type="button" disabled>
                <span aria-hidden="true">⧉</span>
                复制提示词
              </button>
              <button class="secondary-button" id="randomButton" type="button">
                <span aria-hidden="true">↻</span>
                随机灵感
              </button>
            </div>
          </aside>
        </section>
      </main>
    </div>

    <div class="image-lightbox" id="imageLightbox" hidden>
      <button class="lightbox-backdrop" id="lightboxBackdrop" type="button" aria-label="点击背景关闭例图预览"></button>
      <div class="lightbox-panel" role="dialog" aria-modal="true" aria-label="例图预览">
        <button class="icon-button lightbox-close" id="lightboxClose" type="button" aria-label="关闭例图预览">×</button>
        <img id="lightboxImage" alt="例图预览" />
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./script.js"></script>
    <script>
      // hero 粒子流光背景（电青 + 琥珀），reduced-motion 下降级为静态帧
      (function () {
        var canvas = document.getElementById("heroCanvas");
        if (!canvas || !canvas.getContext) return;
        var ctx = canvas.getContext("2d");
        var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var W = 0, H = 0, dpr = 1, raf = null;
        var particles = [];
        var NEON = [
          { glow: "rgba(96, 226, 214, " },
          { glow: "rgba(255, 190, 96, " },
        ];

        function resize() {
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          W = canvas.clientWidth;
          H = canvas.clientHeight;
          canvas.width = W * dpr;
          canvas.height = H * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          seed();
        }
        function make() {
          return {
            x: Math.random() * W,
            y: Math.random() * H,
            r: 0.6 + Math.random() * 1.8,
            vx: (Math.random() - 0.5) * 0.2,
            vy: -0.06 - Math.random() * 0.3,
            hue: Math.random() < 0.6 ? 0 : 1,
            a: 0.2 + Math.random() * 0.5,
            tw: Math.random() * Math.PI * 2,
            tws: 0.006 + Math.random() * 0.018,
          };
        }
        function seed() {
          var area = W * H;
          var count = Math.min(110, Math.max(36, Math.round(area / 11000)));
          particles = [];
          for (var i = 0; i < count; i++) particles.push(make());
        }
        function step() {
          ctx.clearRect(0, 0, W, H);
          ctx.globalCompositeOperation = "lighter";
          for (var i = 0; i < particles.length; i++) {
            var p = particles[i];
            p.x += p.vx + Math.sin(p.tw) * 0.1;
            p.y += p.vy;
            p.tw += p.tws;
            if (p.y < -20) { p.y = H + 20; p.x = Math.random() * W; }
            if (p.x < -20) p.x = W + 20;
            if (p.x > W + 20) p.x = -20;
            var alpha = p.a * (0.6 + 0.4 * Math.sin(p.tw));
            var n = NEON[p.hue];
            ctx.beginPath();
            ctx.fillStyle = n.glow + alpha.toFixed(3) + ")";
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.fillStyle = n.glow + (alpha * 0.3).toFixed(3) + ")";
            ctx.arc(p.x, p.y, p.r * 3, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalCompositeOperation = "source-over";
        }
        function loop() { step(); raf = requestAnimationFrame(loop); }

        resize();
        window.addEventListener("resize", resize);
        if (reduceMotion) { step(); } else { raf = requestAnimationFrame(loop); }
      })();
    </script>
  </body>
</html>
