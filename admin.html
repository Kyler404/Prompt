<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>后台管理 | Prompt Studio</title>
    <meta name="description" content="管理 Prompt Studio 的生图与文笔提示词模板。" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./admin-dark.css" />
  </head>
  <body data-page="admin">
    <div class="app-shell">
      <header class="site-header">
        <nav class="topbar" aria-label="后台导航">
          <a class="brand" href="./index.html" aria-label="返回前台">
            <span class="brand-mark">P</span>
            <span>
              <strong>Prompt Studio</strong>
              <small>生图 / 文笔后台管理</small>
            </span>
          </a>

          <div class="top-actions">
            <a class="admin-link" href="./index.html">查看前台</a>
          </div>
        </nav>
      </header>

      <main>
        <section class="admin-hero">
          <div>
            <p class="eyebrow">Cloud admin</p>
            <h1>管理生图与文笔模板</h1>
            <p>维护两类创作模板、关键词变量与生图例图。改动会保存到云端，前台实时生效。</p>
          </div>
          <div class="admin-actions">
            <button class="primary-button" id="saveAllButton" type="button">保存到云端</button>
          </div>
        </section>

        <section class="admin-workspace" aria-label="提示词后台工作区">
          <aside class="admin-list-panel">
            <div class="section-title">
              <span>模板列表</span>
            </div>
            <label class="search-box admin-search">
              <span class="search-icon" aria-hidden="true">⌕</span>
              <input id="adminSearch" type="search" placeholder="搜索模板" />
            </label>
            <div class="admin-template-list" id="adminTemplateList"></div>
          </aside>

          <section class="admin-editor-panel">
            <div class="editor-header">
              <div>
                <p class="eyebrow">Template Detail</p>
                <h2 id="adminEditorTitle">模板详情</h2>
              </div>
              <div class="mini-actions">
                <button class="text-button" id="newTemplateButton" type="button">新增</button>
                <button class="text-button" id="duplicateButton" type="button">复制</button>
                <button class="text-button danger" id="deleteButton" type="button">删除</button>
              </div>
            </div>

            <form class="admin-form" id="adminForm">
              <div class="form-grid">
                <label class="field">
                  <span>模板名称</span>
                  <input id="titleInput" required />
                </label>
                <label class="field">
                  <span>用途分类</span>
                  <select id="categoryInput" required>
                    <option value="生图">生图</option>
                    <option value="文笔">文笔</option>
                  </select>
                </label>
                <label class="field">
                  <span>热度</span>
                  <input id="popularityInput" type="number" min="0" max="100" required />
                </label>
                <label class="field">
                  <span>日期</span>
                  <input id="dateInput" type="date" required />
                </label>
              </div>

              <label class="field">
                <span>简短说明</span>
                <textarea id="descriptionInput" required></textarea>
              </label>

              <div class="examples-manager">
                <div class="section-title">
                  <span>例图展示</span>
                  <div class="mini-actions">
                    <button class="text-button" id="uploadExampleButton" type="button">上传例图</button>
                  </div>
                </div>
                <div class="example-rows" id="exampleRows"></div>
                <p class="examples-hint">例图按「模板序号-例图序号」自动命名，例如第 3 个模板的第 2 张 → t3-2.webp</p>
              </div>

              <div class="variables-manager">
                <div class="section-title">
                  <span>关键词变量</span>
                  <button class="text-button" id="addVariableButton" type="button">添加变量</button>
                </div>
                <div class="variable-rows" id="variableRows"></div>
              </div>

              <label class="field">
                <span>提示词正文</span>
                <textarea id="promptInput" class="prompt-textarea" required></textarea>
              </label>

              <div class="preview-card">
                <div class="preview-topline">
                  <span>变量写法提示</span>
                </div>
                <pre>在正文中使用 {{变量名}} 作为可编辑关键词，例如：请围绕「{{主题}}」生成方案。</pre>
              </div>
            </form>

            <div class="admin-bottom-actions">
              <button class="secondary-button" id="restoreDefaultsButton" type="button">放弃修改</button>
              <span id="saveStatus">改动会保存到云端。点「保存到云端」后前台实时生效。</span>
            </div>
          </section>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./script.js"></script>
    <script src="./admin.js"></script>
  </body>
</html>
