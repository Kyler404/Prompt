<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>后台管理 | Prompt Studio</title>
    <meta name="description" content="管理 Prompt Studio 的生图与文笔提示词模板。" />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .admin-login-overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(15, 23, 42, 0.92);
        color: #ffffff;
        z-index: 20;
        padding: 1rem;
      }
      .admin-login-card {
        width: min(100%, 420px);
        background: #111827;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.28);
        padding: 2rem;
      }
      .admin-login-card h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
      }
      .admin-login-field {
        width: 100%;
        padding: 0.9rem 1rem;
        margin-top: 0.5rem;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.06);
        color: #ffffff;
      }
      .admin-login-actions {
        margin-top: 1.25rem;
      }
      .admin-login-button {
        width: 100%;
        padding: 0.95rem 1.2rem;
        border: none;
        border-radius: 16px;
        background: #2563eb;
        color: #ffffff;
        font-weight: 600;
        cursor: pointer;
      }
      .admin-login-button:hover {
        background: #1d4ed8;
      }
      .admin-login-error {
        margin-top: 0.75rem;
        min-height: 1.25rem;
        color: #f87171;
      }
      .admin-login-overlay[hidden],
      .admin-login-overlay.hidden {
        display: none !important;
      }
      .app-shell[hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body data-page="admin">
    <div class="admin-login-overlay" id="adminLoginOverlay">
      <div class="admin-login-card">
        <h1>管理员登录</h1>
        <p>请输入密码以访问后台管理页面。</p>
        <form id="loginForm">
          <label class="field">
            <span>密码</span>
            <input id="loginPasswordInput" class="admin-login-field" type="password" autocomplete="current-password" required />
          </label>
          <div class="admin-login-actions">
            <button class="admin-login-button" type="submit">登录</button>
          </div>
          <div id="loginError" class="admin-login-error" aria-live="polite"></div>
        </form>
      </div>
    </div>
    <div class="app-shell" hidden>
      <header class="site-header">
        <nav class="topbar" aria-label="后台导航">
          <a class="brand" href="./index.html" aria-label="返回前台">
            <span class="brand-mark">P</span>
            <span>
              <strong>Prompt Studio</strong>
              <small>生图 / 文笔后台管理</small>
            </span>
          </a>

          <div class="top-actions">
            <a class="admin-link" href="./index.html">查看前台</a>
            <button class="icon-button" id="themeToggle" type="button" aria-label="切换深浅色主题">
              <span class="theme-icon" aria-hidden="true">☾</span>
            </button>
          </div>
        </nav>
      </header>

      <main>
        <section class="admin-hero">
          <div>
            <p class="eyebrow">Local admin</p>
            <h1>管理生图与文笔模板</h1>
            <p>维护两类创作模板、关键词变量与生图例图。导出 JSON 后可用工具写回本地文件。</p>
          </div>
          <div class="admin-actions">
            <button class="secondary-button" id="importButton" type="button">导入 JSON</button>
            <button class="secondary-button" id="exportButton" type="button">导出 JSON</button>
            <button class="primary-button" id="saveAllButton" type="button">校验模板</button>
          </div>
        </section>

        <section class="admin-workspace" aria-label="提示词后台工作区">
          <aside class="admin-list-panel">
            <div class="section-title">
              <span>模板列表</span>
            </div>
            <label class="search-box admin-search">
              <span class="search-icon" aria-hidden="true">⌕</span>
              <input id="adminSearch" type="search" placeholder="搜索模板" />
            </label>
            <div class="admin-template-list" id="adminTemplateList"></div>
          </aside>

          <section class="admin-editor-panel">
            <div class="editor-header">
              <div>
                <p class="eyebrow">Template Detail</p>
                <h2 id="adminEditorTitle">模板详情</h2>
              </div>
              <div class="mini-actions">
                <button class="text-button" id="newTemplateButton" type="button">新增</button>
                <button class="text-button" id="duplicateButton" type="button">复制</button>
                <button class="text-button danger" id="deleteButton" type="button">删除</button>
              </div>
            </div>

            <form class="admin-form" id="adminForm">
              <div class="form-grid">
                <label class="field">
                  <span>模板名称</span>
                  <input id="titleInput" required />
                </label>
                <label class="field">
                  <span>用途分类</span>
                  <select id="categoryInput" required>
                    <option value="生图">生图</option>
                    <option value="文笔">文笔</option>
                  </select>
                </label>
                <label class="field">
                  <span>热度</span>
                  <input id="popularityInput" type="number" min="0" max="100" required />
                </label>
                <label class="field">
                  <span>日期</span>
                  <input id="dateInput" type="date" required />
                </label>
              </div>

              <label class="field">
                <span>简短说明</span>
                <textarea id="descriptionInput" required></textarea>
              </label>

              <div class="examples-manager">
                <div class="section-title">
                  <span>例图展示</span>
                  <button class="text-button" id="addExampleButton" type="button">添加例图</button>
                </div>
                <div class="example-rows" id="exampleRows"></div>
              </div>

              <div class="variables-manager">
                <div class="section-title">
                  <span>关键词变量</span>
                  <button class="text-button" id="addVariableButton" type="button">添加变量</button>
                </div>
                <div class="variable-rows" id="variableRows"></div>
              </div>

              <label class="field">
                <span>提示词正文</span>
                <textarea id="promptInput" class="prompt-textarea" required></textarea>
              </label>

              <div class="preview-card">
                <div class="preview-topline">
                  <span>变量写法提示</span>
                </div>
                <pre>在正文中使用 {{变量名}} 作为可编辑关键词，例如：请围绕「{{主题}}」生成方案。</pre>
              </div>
            </form>

            <div class="admin-bottom-actions">
              <button class="secondary-button" id="restoreDefaultsButton" type="button">恢复内置模板</button>
              <span id="saveStatus">模板只以文件为准。编辑后导出 JSON，再运行工具写回 script.js。</span>
            </div>
          </section>
        </section>
      </main>
    </div>

    <input id="importFile" type="file" accept="application/json,.json" hidden />
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./script.js"></script>
    <script src="./admin.js"></script>
  </body>
</html>
